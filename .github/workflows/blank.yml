
name: Daily Crypto Anomaly Run

on:
  schedule:
    - cron: "0 2 * * *"  # runs daily at 02:00 UTC
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run notebook
        env:
          PYTHONUNBUFFERED: "1"
        run: python run_daily.py

      - name: Upload result notebook
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-report
          path: outputs/*.ipynb
