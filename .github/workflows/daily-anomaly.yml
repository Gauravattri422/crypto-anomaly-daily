name: Daily Crypto Anomaly Run

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output folder
        run: mkdir -p outputs

      - name: Run notebook
        run: |
          papermill "Anomoly_detection in crypto.ipynb" outputs/output.ipynb

      - name: Upload result notebook
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-report
          path: outputs/output.ipynb
